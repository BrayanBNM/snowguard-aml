name: SnowGuard_AML_Semantic_Model
description: Semantic model for the SnowGuard AML Compliance and Structuring Triage engine, indexing transactional ledger and customer risk data.
tables:
  - name: ACCOUNTS
    description: Master registry of customer bank accounts containing risk scores, risk tiers, and customer country details.
    columns:
      - name: ACCOUNT_ID
        description: Unique identifier for each bank account.
        data_type: VARCHAR
        logical_name: account ID
        synonyms: ["account number", "acc_id", "client account"]
      - name: CUSTOMER_NAME
        description: Full legal name of the account owner or entity.
        data_type: VARCHAR
        logical_name: customer name
        synonyms: ["account holder", "owner name", "client name"]
      - name: ACCOUNT_TYPE
        description: Type of bank account (e.g., Checking, Savings, Business Checking).
        data_type: VARCHAR
        logical_name: account type
        synonyms: ["acc_type", "product type"]
      - name: RISK_SCORE
        description: Continuous risk coefficient generated by AML classification algorithms, ranging from 0.00 to 1.00.
        data_type: NUMBER
        logical_name: risk score
        synonyms: ["aml risk coefficient", "compliance score"]
      - name: RISK_TIER
        description: Categorical risk tier (Low, Medium, High) determined by customer profile and country risks.
        data_type: VARCHAR
        logical_name: risk tier
        synonyms: ["aml risk category", "risk profile"]
      - name: COUNTRY
        description: ISO country code where the account is registered or where the customer resides.
        data_type: VARCHAR
        logical_name: country
        synonyms: ["domicile", "account country", "jurisdiction"]
      - name: CREATED_AT
        description: Date and time when the bank account was opened.
        data_type: TIMESTAMP_NTZ
        logical_name: account creation timestamp
        synonyms: ["opened date", "creation date"]

  - name: TRANSACTIONS
    description: Historical ledger of all financial transactions, including deposits, withdrawals, and outbound/inbound transfers.
    columns:
      - name: TRANSACTION_ID
        description: Unique identifier for the ledger entry.
        data_type: VARCHAR
        logical_name: transaction ID
        synonyms: ["txn_id", "reference ID", "transaction reference"]
      - name: ACCOUNT_ID
        description: Foreign key linking to the master account registry.
        data_type: VARCHAR
        logical_name: account ID
        synonyms: ["account number", "acc_id"]
      - name: AMOUNT
        description: Absolute monetary value of the transaction in USD.
        data_type: NUMBER
        logical_name: transaction amount
        synonyms: ["txn amount", "value", "sum", "volume"]
      - name: TRANSACTION_TYPE
        description: The classification of transfer (e.g., DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT).
        data_type: VARCHAR
        logical_name: transaction type
        synonyms: ["type of transaction", "txn_type"]
      - name: METHOD
        description: The settlement instrument utilized (e.g., CASH, WIRE, ACH, CHECK).
        data_type: VARCHAR
        logical_name: transaction method
        synonyms: ["settlement method", "payment channel"]
      - name: TIMESTAMP
        description: Timestamp of when the transaction was cleared and posted.
        data_type: TIMESTAMP_NTZ
        logical_name: transaction timestamp
        synonyms: ["cleared date", "posting date", "timestamp"]
      - name: COUNTERPARTY_ACCOUNT
        description: Identifies the opposing account ID involved in transfers, where applicable.
        data_type: VARCHAR
        logical_name: counterparty account ID
        synonyms: ["beneficiary account", "sender account", "recipient"]
      - name: COUNTERPARTY_COUNTRY
        description: ISO country code of the counterparty entity or bank.
        data_type: VARCHAR
        logical_name: counterparty country
        synonyms: ["destination country", "origin country"]
      - name: STATUS
        description: The current lifecycle state of the transaction (e.g., COMPLETED, PENDING, FAILED).
        data_type: VARCHAR
        logical_name: transaction status
        synonyms: ["clearing status", "txn_status"]

verified_queries:
  - name: "Identify Structuring Suspects"
    question: "Which accounts have multiple cash deposits between $9,000 and $10,000 within a 48-hour window?"
    sql: >
      WITH cash_deposits AS (
        SELECT 
          t.account_id,
          a.customer_name,
          a.risk_tier,
          t.amount,
          t.timestamp AS current_txn_time,
          LEAD(t.timestamp) OVER (PARTITION BY t.account_id ORDER BY t.timestamp) AS next_txn_time,
          LEAD(t.amount) OVER (PARTITION BY t.account_id ORDER BY t.timestamp) AS next_txn_amount
        FROM TRANSACTIONS t
        JOIN ACCOUNTS a ON t.account_id = a.account_id
        WHERE t.transaction_type = 'DEPOSIT' 
          AND t.method = 'CASH' 
          AND t.amount >= 9000.00 
          AND t.amount < 10000.00
      )
      SELECT 
        account_id,
        customer_name,
        risk_tier,
        current_txn_time,
        amount AS first_deposit,
        next_txn_time,
        next_txn_amount AS second_deposit,
        (amount + next_txn_amount) AS total_structured_deposits,
        DATEDIFF('hour', current_txn_time, next_txn_time) AS hour_difference
      FROM cash_deposits
      WHERE next_txn_time IS NOT NULL 
        AND DATEDIFF('hour', current_txn_time, next_txn_time) <= 48
      ORDER BY total_structured_deposits DESC;

  - name: "Detect Layering via Outbound Wires"
    question: "List accounts that received deposits followed by immediate offshore wire transfers to tax havens or secrecy jurisdictions."
    sql: >
      WITH in_out_flow AS (
        SELECT 
          t1.account_id,
          a.customer_name,
          a.risk_score,
          t1.amount AS deposit_amount,
          t1.method AS deposit_method,
          t1.timestamp AS deposit_time,
          t2.amount AS wire_amount,
          t2.counterparty_country AS destination_country,
          t2.timestamp AS wire_time,
          DATEDIFF('hour', t1.timestamp, t2.timestamp) AS timing_diff_hours
        FROM TRANSACTIONS t1
        JOIN TRANSACTIONS t2 ON t1.account_id = t2.account_id
        JOIN ACCOUNTS a ON t1.account_id = a.account_id
        WHERE t1.transaction_type = 'DEPOSIT'
          AND t2.transaction_type = 'TRANSFER_OUT'
          AND t2.method = 'WIRE'
          AND t2.counterparty_country IN ('KY', 'PA', 'CH')
          AND t2.timestamp > t1.timestamp
          AND DATEDIFF('hour', t1.timestamp, t2.timestamp) <= 48
      )
      SELECT 
        account_id,
        customer_name,
        risk_score,
        deposit_amount,
        deposit_method,
        deposit_time,
        wire_amount,
        destination_country,
        wire_time,
        timing_diff_hours
      FROM in_out_flow
      ORDER BY timing_diff_hours ASC, wire_amount DESC;

  - name: "Aggregate High Risk Ledger Exposure"
    question: "Show the aggregate volume of sub-threshold cash transactions and total wire transfers grouped by account risk tier."
    sql: >
      SELECT 
        a.risk_tier,
        COUNT(CASE WHEN t.method = 'CASH' AND t.amount >= 9000.00 AND t.amount < 10000.00 THEN 1 END) AS count_structured_cash_txns,
        SUM(CASE WHEN t.method = 'CASH' AND t.amount >= 9000.00 AND t.amount < 10000.00 THEN t.amount ELSE 0.00 END) AS total_structured_cash_volume,
        COUNT(CASE WHEN t.method = 'WIRE' THEN 1 END) AS count_total_wire_txns,
        SUM(CASE WHEN t.method = 'WIRE' THEN t.amount ELSE 0.00 END) AS total_wire_volume
      FROM TRANSACTIONS t
      JOIN ACCOUNTS a ON t.account_id = a.account_id
      GROUP BY a.risk_tier
      ORDER BY total_structured_cash_volume DESC;
